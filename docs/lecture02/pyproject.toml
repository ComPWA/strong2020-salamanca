[project]
name = "lecture"
version = "0.1.0"
requires-python = "~=3.13.0"
dependencies = [
    "gdown",
    "matplotlib",
    "numpy",
    "particle",
]

[tool.ruff]
preview = true

[tool.ruff.lint]
allowed-confusables = ["–"]
ignore = [
    "ANN001",
    "COM812",
    "CPY001",
    "D",
    "ISC001",
    "PLR2004",
    "T201",
]
select = ["ALL"]

[tool.ruff.lint.flake8-builtins]
ignorelist = ["display"]

[tool.uv.workspace]
