[project]
name = "lecture"
version = "0.1.0"
requires-python = "~=3.13.0"
dependencies = [
    "matplotlib",
    "numpy",
    "phasespace",
    "pylorentz",
    "tf_keras",
]

[tool.ruff]
preview = true

[tool.ruff.lint]
ignore = [
    "missing-type-function-argument",
    "missing-return-type-undocumented-public-function",
    "missing-trailing-comma",
    "missing-copyright-notice",
    "D",
    "single-line-implicit-string-concatenation",
]
select = ["ALL"]

[tool.uv.workspace]
