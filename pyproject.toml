[project]
name = "strong2020-salamanca"
description = "Jupyter notebooks for the STRONG2020 school in Salamanca, 2023"
requires-python = "~=3.13.0"
authors = [
    { name = "Common Partial Wave Analysis", email = "compwa-admin@ep1.rub.de" },
    { name = "STRONG2020" }
]
dynamic = ["version"]

[dependency-groups]
dev = [
    "ruff",
    { include-group = "doc" },
    { include-group = "jupyter" },
    { include-group = "test" }
]
doc = [
    "ipympl",
    "myst-nb",
    "sphinx",
    "sphinx-api-relink",
    "sphinx-book-theme",
    "sphinx-comments",
    "sphinx-copybutton",
    "sphinx-design",
    "sphinx-exercise",
    "sphinx-togglebutton",
    { include-group = "notebooks" }
]
jupyter = [
    "jupyter-ruff",
    "jupyterlab",
    "jupyterlab-git",
    "jupyterlab-lsp",
    "jupyterlab-myst",
    "jupyterlab-quickopen",
    "python-lsp-ruff",
    "python-lsp-server",
    { include-group = "notebooks" }
]
notebooks = ["pyproject-local-kernel"]
test = [{ include-group = "notebooks" }]

[build-system]
requires = [
    "setuptools>=61.2",
    "setuptools_scm",
]
build-backend = "setuptools.build_meta"

[tool.compwa.policy]
repo-name = "strong2020-salamanca"
repo-title = "STRONG2020 HaSP School"

[tool.compwa.policy.github]
no-cd = true
no-pypi = true

[tool.poe.executor]
isolated = true
no-group = "dev"
type = "uv"

[tool.poe.groups.doc]
heading = "Documentation"

[tool.poe.groups.doc.tasks.doc]
cmd = """
sphinx-build \
    --builder=html \
    --fail-on-warning \
    --keep-going \
    --show-traceback \
    docs/ \
    docs/_build/html/
"""
env = { PYTHONWARNINGS = "" }
executor = { group = "doc" }
help = "Build documentation and API"

[tool.poe.groups.doc.tasks.doclive]
cmd = """
sphinx-autobuild \
    --builder=html \
    --open-browser \
    --port=0 \
    --re-ignore=/__pycache__(/.*)?$ \
    --re-ignore=/_build(/.*)?$ \
    --re-ignore=/_images(/.*)?$ \
    --re-ignore=/\\.cache(/.*)?$ \
    --re-ignore=/\\.egg-info(/.*)?$ \
    --re-ignore=/\\.ipynb_checkpoints(/.*)?$ \
    --re-ignore=/\\.venv(/.*)?$ \
    --re-ignore=/\\.virtual_documents(/.*)?$ \
    --re-ignore=/api(/.*)?$ \
    --re-ignore=/docs$ \
    --re-ignore=/version\\.py$ \
    --re-ignore=\\.csv$ \
    --re-ignore=\\.egg-info(/.*)?$ \
    --re-ignore=\\.gif$ \
    --re-ignore=\\.gitignore$ \
    --re-ignore=\\.gv$ \
    --re-ignore=\\.inv$ \
    --re-ignore=\\.json$ \
    --re-ignore=\\.pickle$ \
    --re-ignore=\\.pkl$ \
    --re-ignore=\\.png$ \
    --re-ignore=\\.root$ \
    --re-ignore=\\.svg$ \
    --re-ignore=\\.tmp$ \
    --re-ignore=\\.txt$ \
    --re-ignore=\\.ya?ml$ \
    --watch=src \
    docs/ \
    docs/_build/html/
"""
executor = { group = "doc", with = "sphinx-autobuild" }
help = "Set up a server to directly preview changes to the HTML pages"

[tool.poe.groups.doc.tasks.docnb]
env = { EXECUTE_NB = "yes" }
help = "Build documentation and API with cached notebook execution"
sequence = ["doc"]

[tool.poe.groups.doc.tasks.docnb-force]
env = { FORCE_EXECUTE_NB = "yes" }
help = "Build documentation and API with notebook execution (no cache)"
sequence = ["doc"]

[tool.poe.groups.doc.tasks.docnblive]
env = { EXECUTE_NB = "yes" }
help = "Set up a server to directly preview changes to the HTML pages with cached notebook execution"
sequence = ["doclive"]

[tool.poe.groups.doc.tasks.linkcheck]
cmd = """
sphinx-build \
    --builder=linkcheck \
    --show-traceback \
    docs/ \
    docs/_build/linkcheck/
"""
env = { PYTHONWARNINGS = "" }
executor = { group = "doc" }
help = "Check external links in the documentation (requires internet connection)"

[tool.poe.groups.notebook]
heading = "Notebooks"

[tool.poe.groups.notebook.tasks.lab]
args = [{ name = "paths", default = "", positional = true }]
cmd = "jupyter lab ${paths}"
executor = { group = "jupyter" }
help = "Launch Jupyter Lab"

[tool.poe.groups.notebook.tasks.nb]
args = [{ name = "paths", default = "docs", multiple = true, positional = true }]
cmd = "pytest --nbmake --nbmake-timeout=0 ${paths}"
executor = { group = "notebooks", with = "nbmake" }
help = "Run all notebooks"

[tool.poe.tasks.all]
help = "Run all continuous integration (CI) tasks locally"
ignore_fail = "return_non_zero"
sequence = [
    "style",
    "linkcheck",
    "docnb-force",
]

[tool.poe.tasks.style]
cmd = "prek run --all-files"
help = "Perform all linting, formatting, and spelling checks"

[tool.poe.tasks.upgrade]
executor = { type = "simple" }
help = "Upgrade lock files"
parallel = [
    "_upgrade-precommit",
    "_upgrade-uv",
]

[tool.poe.tasks._upgrade-precommit]
cmd = "prek autoupdate"
executor = { type = "simple" }

[tool.poe.tasks._upgrade-uv]
expr = """
all([
    subprocess.run(
        ["uv", "lock", "--upgrade", "--directory", str(pathlib.Path(file).parent)],
        check=False,
    ).returncode == 0
    for file in subprocess.run(
        ["git", "ls-files"],
        check=True,
        capture_output=True,
        text=True,
    ).stdout.splitlines()
    if pathlib.Path(file).name == "pyproject.toml"
])
"""
imports = ["pathlib", "subprocess"]
assert = true
executor = { type = "simple" }

[tool.pytest.ini_options]
addopts = [
    "--color=yes",
    "--durations=0",
    "--nbmake",
    "--nbmake-timeout=0",
]
filterwarnings = ["error"]
norecursedirs = [
    ".ipynb_checkpoints",
    ".virtual_documents",
    "_build",
]

[tool.ruff]
extend-include = ["*.ipynb"]
preview = true
show-fixes = true

[tool.ruff.format]
docstring-code-format = true
line-ending = "lf"

[tool.ruff.lint]
ignore = [
    "DOC",
    "PTH",
    "any-type",
    "if-else-block-instead-of-if-exp",
    "incorrect-blank-line-before-class",
    "line-too-long",
    "logging-f-string",
    "missing-copyright-notice",
    "missing-dashed-underline-after-section",
    "missing-section-name-colon",
    "missing-trailing-comma",
    "multi-line-summary-second-line",
    "non-empty-init-module",
    "pytest-fixture-incorrect-parentheses-style",
    "read-whole-file",
    "reimplemented-starmap",
    "single-line-implicit-string-concatenation",
    "undocumented-magic-method",
    "undocumented-public-class",
    "undocumented-public-function",
    "undocumented-public-init",
    "undocumented-public-method",
    "unspecified-encoding",
    "write-whole-file",
]
select = ["ALL"]
task-tags = ["cspell"]

[tool.ruff.lint.flake8-builtins]
ignorelist = ["display"]

[tool.ruff.lint.flake8-comprehensions]
allow-dict-calls-with-keyword-arguments = true

[tool.ruff.lint.isort]
split-on-trailing-comma = false

[tool.ruff.lint.per-file-ignores]
"*.ipynb" = [
    "ANN",
    "C90",
    "D",
    "N80",
    "PLR09",
    "T20",
    "TC00",
    "assert",
    "global-statement",
    "global-variable-not-assigned",
    "lambda-assignment",
    "magic-value-comparison",
    "mixed-case-variable-in-global-scope",
    "module-import-not-at-top-of-file",
    "non-lowercase-variable-in-function",
    "too-many-blank-lines",
    "useless-expression",
    "useless-semicolon",
]
"docs/*" = [
    "assert",
    "implicit-namespace-package",
    "request-without-timeout",
]
"docs/conf.py" = [
    "builtin-variable-shadowing",
    "undocumented-public-module",
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.tombi.files]
exclude = ["**/uv.lock"]

[tool.tombi.format.rules]
indent-width = 4
line-width = 88

[tool.tombi.lint.rules]
key-empty = "off"

[[tool.tombi.schemas]]
root = "tool.compwa.policy"
path = "https://raw.githubusercontent.com/ComPWA/policy/0.10.0/compwa-policy.schema.json"
include = ["pyproject.toml"]
